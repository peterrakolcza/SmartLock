; Build with PlatformIO:  pio run -e smartlock -t upload   (the Arduino IDE works for the ESP8266 board too)
[platformio]
src_dir = .
default_envs = smartlock

[env]
framework = arduino
build_src_filter = +<*> -<.pio/> -<.dummy/> -<managed_components/>
monitor_speed = 9600
lib_deps =
  bblanchon/ArduinoJson@^7
  knolleary/PubSubClient@^2.8

; Original V3 PCB, ESP8266, USB powered
[env:smartlock]
platform = espressif8266
board = esp12e

; Low power V4 board, ESP32-C3, battery powered
; The stock Arduino core is built without power management, custom_sdkconfig rebuilds it with automatic light
; sleep (the first build takes a while)
[env:smartlock-battery]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c3-devkitm-1
board_build.flash_mode = dio
build_flags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  ${env.lib_deps}
  madhephaestus/ESP32Servo@^3
custom_sdkconfig =
  CONFIG_PM_ENABLE=y
  CONFIG_FREERTOS_USE_TICKLESS_IDLE=y
  CONFIG_FREERTOS_IDLE_TIME_BEFORE_SLEEP=3
  CONFIG_ESP_WIFI_SLP_IRAM_OPT=y
