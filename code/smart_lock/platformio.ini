; Build with PlatformIO:  pio run -t upload   (the Arduino IDE works too, open smart_lock.ino)
[platformio]
src_dir = .

[env:smartlock]
platform = espressif8266
board = esp12e
framework = arduino
monitor_speed = 9600
build_src_filter = +<*> -<.pio/>
lib_deps =
  bblanchon/ArduinoJson@^7
  knolleary/PubSubClient@^2.8
