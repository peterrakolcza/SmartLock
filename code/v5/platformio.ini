; v5 firmware for the ESP32-C6 board (PCB/v5): pio run -t upload
[env:smartlock-v5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c6-devkitc-1
board_build.flash_size = 4MB          ; ESP32-C6-MINI-1-N4
board_upload.flash_size = 4MB
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
; motion.h is shared with the V3 sketch and its simulation (code/tests/motion)
; the worm drive turns the hub in ~5 s (the servo in 1.2 s): the stall timeout before learning depends on it
build_flags = -I../smart_lock -DMOTION_DEFAULT_REV_MS=6000

